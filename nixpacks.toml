# API Laravel — pas de build Vite (frontend séparé sur africa_frontend)
[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = ["php artisan config:cache || true", "php artisan route:cache || true"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
